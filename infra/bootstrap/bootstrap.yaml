AWSTemplateFormatVersion: "2010-09-09"
Description: >
  One-time bootstrap for sn-change-intel. Creates the Terraform state bucket, the GitHub OIDC trust
  and the pipeline roles. Deploy ONCE per AWS account with admin credentials. Everything else is
  created by the CI/CD pipeline.

Parameters:
  GitHubOrg:
    Type: String
    Description: GitHub organisation or user that owns the repository
  GitHubRepo:
    Type: String
    Description: Repository name
  Prefix:
    Type: String
    Default: sn-change-intel
  CreateOidcProvider:
    Type: String
    AllowedValues: ["true", "false"]
    Default: "true"
    Description: Set to false if this account already has the GitHub OIDC provider

Conditions:
  MakeOidc: !Equals [!Ref CreateOidcProvider, "true"]

Resources:
  StateBucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      BucketName: !Sub "${Prefix}-tfstate-${AWS::AccountId}-${AWS::Region}"
      VersioningConfiguration:
        Status: Enabled
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      LifecycleConfiguration:
        Rules:
          - Id: expire-old-state-versions
            Status: Enabled
            NoncurrentVersionExpiration:
              NoncurrentDays: 90

  StateBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref StateBucket
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: DenyInsecureTransport
            Effect: Deny
            Principal: "*"
            Action: "s3:*"
            Resource:
              - !GetAtt StateBucket.Arn
              - !Sub "${StateBucket.Arn}/*"
            Condition:
              Bool:
                "aws:SecureTransport": "false"

  GitHubOidcProvider:
    Type: AWS::IAM::OIDCProvider
    Condition: MakeOidc
    Properties:
      Url: https://token.actions.githubusercontent.com
      ClientIdList:
        - sts.amazonaws.com
      ThumbprintList:
        - 6938fd4d98bab03faadb97b34396831e3780aea1
        - 1c58a3a8518e8759bf075b76b750d4f2df264fcd

  # Read-only role used by pull requests to run `terraform plan`. It cannot read application data.
  PlanRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub "${Prefix}-gha-plan"
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Federated: !If
                - MakeOidc
                - !Ref GitHubOidcProvider
                - !Sub "arn:aws:iam::${AWS::AccountId}:oidc-provider/token.actions.githubusercontent.com"
            Action: sts:AssumeRoleWithWebIdentity
            Condition:
              StringEquals:
                "token.actions.githubusercontent.com:aud": sts.amazonaws.com
              StringLike:
                "token.actions.githubusercontent.com:sub":
                  - !Sub "repo:${GitHubOrg}/${GitHubRepo}:pull_request"
                  - !Sub "repo:${GitHubOrg}@*/${GitHubRepo}@*:pull_request"
      Policies:
        - PolicyName: plan-read-only
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Sid: StateRead
                Effect: Allow
                Action: ["s3:ListBucket", "s3:GetObject"]
                Resource:
                  - !GetAtt StateBucket.Arn
                  - !Sub "${StateBucket.Arn}/*"
              - Sid: DescribeResources
                Effect: Allow
                Action:
                  - "s3:GetBucket*"
                  - "s3:GetAccelerateConfiguration"
                  - "s3:GetEncryptionConfiguration"
                  - "s3:GetLifecycleConfiguration"
                  - "s3:GetReplicationConfiguration"
                  - "s3:ListBucket"
                  - "kms:Describe*"
                  - "kms:GetKeyPolicy"
                  - "kms:GetKeyRotationStatus"
                  - "kms:ListResourceTags"
                  - "kms:ListAliases"
                  - "dynamodb:Describe*"
                  - "dynamodb:ListTagsOfResource"
                  - "secretsmanager:DescribeSecret"
                  - "secretsmanager:GetResourcePolicy"
                  - "sqs:GetQueueAttributes"
                  - "sqs:ListQueueTags"
                  - "iam:GetRole"
                  - "iam:GetRolePolicy"
                  - "iam:ListRolePolicies"
                  - "iam:ListAttachedRolePolicies"
                  - "iam:ListInstanceProfilesForRole"
                  - "lambda:GetFunction"
                  - "lambda:GetFunctionCodeSigningConfig"
                  - "lambda:GetPolicy"
                  - "lambda:ListVersionsByFunction"
                  - "lambda:ListTags"
                  - "events:Describe*"
                  - "events:ListTagsForResource"
                  - "events:ListTargetsByRule"
                  - "logs:DescribeLogGroups"
                  - "logs:ListTagsForResource"
                  - "logs:ListTagsLogGroup"
                  - "cloudwatch:DescribeAlarms"
                  - "cloudwatch:ListTagsForResource"
                  - "s3vectors:GetVectorBucket"
                  - "s3vectors:GetIndex"
                  - "s3vectors:ListIndexes"
                Resource: "*"

  DevDeployPolicy:
    Type: AWS::IAM::ManagedPolicy
    Properties:
      ManagedPolicyName: !Sub "${Prefix}-gha-deploy-dev"
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: TerraformState
            Effect: Allow
            Action: ["s3:ListBucket", "s3:GetObject", "s3:PutObject", "s3:DeleteObject"]
            Resource:
              - !GetAtt StateBucket.Arn
              - !Sub "${StateBucket.Arn}/${Prefix}/dev.tfstate*"
          - Sid: AppBuckets
            Effect: Allow
            Action: "s3:*"
            Resource:
              - !Sub "arn:aws:s3:::${Prefix}-dev-*"
              - !Sub "arn:aws:s3:::${Prefix}-dev-*/*"
          - Sid: KmsCreate
            Effect: Allow
            Action: ["kms:CreateKey", "kms:CreateAlias", "kms:TagResource", "kms:ListAliases", "kms:ListKeys"]
            Resource: "*"
          - Sid: KmsManageTaggedKeys
            Effect: Allow
            Action:
              - "kms:Describe*"
              - "kms:Get*"
              - "kms:List*"
              - "kms:EnableKeyRotation"
              - "kms:PutKeyPolicy"
              - "kms:ScheduleKeyDeletion"
              - "kms:UpdateAlias"
              - "kms:DeleteAlias"
              - "kms:UntagResource"
              - "kms:GenerateDataKey"
              - "kms:Decrypt"
              - "kms:CreateGrant"
            Resource: "*"
            Condition:
              StringEquals:
                "aws:ResourceTag/project": !Ref Prefix
                "aws:ResourceTag/env": dev
          - Sid: DynamoDb
            Effect: Allow
            Action: "dynamodb:*"
            Resource: !Sub "arn:aws:dynamodb:*:${AWS::AccountId}:table/${Prefix}-dev-*"
          - Sid: Secrets
            Effect: Allow
            Action: "secretsmanager:*"
            Resource: !Sub "arn:aws:secretsmanager:*:${AWS::AccountId}:secret:${Prefix}-dev/*"
          - Sid: Queues
            Effect: Allow
            Action: "sqs:*"
            Resource: !Sub "arn:aws:sqs:*:${AWS::AccountId}:${Prefix}-dev-*"
          - Sid: Functions
            Effect: Allow
            Action: "lambda:*"
            Resource: !Sub "arn:aws:lambda:*:${AWS::AccountId}:function:${Prefix}-dev-*"
          - Sid: FunctionRoles
            Effect: Allow
            Action:
              - "iam:CreateRole"
              - "iam:DeleteRole"
              - "iam:GetRole"
              - "iam:PutRolePolicy"
              - "iam:DeleteRolePolicy"
              - "iam:GetRolePolicy"
              - "iam:ListRolePolicies"
              - "iam:ListAttachedRolePolicies"
              - "iam:ListInstanceProfilesForRole"
              - "iam:TagRole"
              - "iam:UntagRole"
              - "iam:UpdateAssumeRolePolicy"
            Resource: !Sub "arn:aws:iam::${AWS::AccountId}:role/${Prefix}-dev-*"
          - Sid: PassFunctionRoles
            Effect: Allow
            Action: "iam:PassRole"
            Resource: !Sub "arn:aws:iam::${AWS::AccountId}:role/${Prefix}-dev-*"
            Condition:
              StringEquals:
                "iam:PassedToService": lambda.amazonaws.com
          - Sid: Schedules
            Effect: Allow
            Action: "events:*"
            Resource: !Sub "arn:aws:events:*:${AWS::AccountId}:rule/${Prefix}-dev-*"
          - Sid: LogGroups
            Effect: Allow
            Action: "logs:*"
            Resource: !Sub "arn:aws:logs:*:${AWS::AccountId}:log-group:/aws/lambda/${Prefix}-dev-*"
          - Sid: LogGroupLookup
            Effect: Allow
            Action: ["logs:DescribeLogGroups", "logs:ListTagsForResource"]
            Resource: "*"
          - Sid: Alarms
            Effect: Allow
            Action: ["cloudwatch:PutMetricAlarm", "cloudwatch:DeleteAlarms", "cloudwatch:TagResource", "cloudwatch:UntagResource", "cloudwatch:ListTagsForResource"]
            Resource: !Sub "arn:aws:cloudwatch:*:${AWS::AccountId}:alarm:${Prefix}-dev-*"
          - Sid: AlarmLookup
            Effect: Allow
            Action: "cloudwatch:DescribeAlarms"
            Resource: "*"
          - Sid: VectorStore
            Effect: Allow
            Action: "s3vectors:*"
            Resource:
              - !Sub "arn:aws:s3vectors:*:${AWS::AccountId}:bucket/${Prefix}-dev-*"
              - !Sub "arn:aws:s3vectors:*:${AWS::AccountId}:bucket/${Prefix}-dev-*/index/*"

  DevDeployRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub "${Prefix}-gha-deploy-dev"
      ManagedPolicyArns:
        - !Ref DevDeployPolicy
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Federated: !If
                - MakeOidc
                - !Ref GitHubOidcProvider
                - !Sub "arn:aws:iam::${AWS::AccountId}:oidc-provider/token.actions.githubusercontent.com"
            Action: sts:AssumeRoleWithWebIdentity
            Condition:
              StringEquals:
                "token.actions.githubusercontent.com:aud": sts.amazonaws.com
              StringLike:
                "token.actions.githubusercontent.com:sub":
                  - !Sub "repo:${GitHubOrg}/${GitHubRepo}:environment:dev"
                  - !Sub "repo:${GitHubOrg}@*/${GitHubRepo}@*:environment:dev"

  ProdDeployPolicy:
    Type: AWS::IAM::ManagedPolicy
    Properties:
      ManagedPolicyName: !Sub "${Prefix}-gha-deploy-prod"
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: TerraformState
            Effect: Allow
            Action: ["s3:ListBucket", "s3:GetObject", "s3:PutObject", "s3:DeleteObject"]
            Resource:
              - !GetAtt StateBucket.Arn
              - !Sub "${StateBucket.Arn}/${Prefix}/prod.tfstate*"
          - Sid: AppBuckets
            Effect: Allow
            Action: "s3:*"
            Resource:
              - !Sub "arn:aws:s3:::${Prefix}-prod-*"
              - !Sub "arn:aws:s3:::${Prefix}-prod-*/*"
          - Sid: KmsCreate
            Effect: Allow
            Action: ["kms:CreateKey", "kms:CreateAlias", "kms:TagResource", "kms:ListAliases", "kms:ListKeys"]
            Resource: "*"
          - Sid: KmsManageTaggedKeys
            Effect: Allow
            Action:
              - "kms:Describe*"
              - "kms:Get*"
              - "kms:List*"
              - "kms:EnableKeyRotation"
              - "kms:PutKeyPolicy"
              - "kms:ScheduleKeyDeletion"
              - "kms:UpdateAlias"
              - "kms:DeleteAlias"
              - "kms:UntagResource"
              - "kms:GenerateDataKey"
              - "kms:Decrypt"
              - "kms:CreateGrant"
            Resource: "*"
            Condition:
              StringEquals:
                "aws:ResourceTag/project": !Ref Prefix
                "aws:ResourceTag/env": prod
          - Sid: DynamoDb
            Effect: Allow
            Action: "dynamodb:*"
            Resource: !Sub "arn:aws:dynamodb:*:${AWS::AccountId}:table/${Prefix}-prod-*"
          - Sid: Secrets
            Effect: Allow
            Action: "secretsmanager:*"
            Resource: !Sub "arn:aws:secretsmanager:*:${AWS::AccountId}:secret:${Prefix}-prod/*"
          - Sid: Queues
            Effect: Allow
            Action: "sqs:*"
            Resource: !Sub "arn:aws:sqs:*:${AWS::AccountId}:${Prefix}-prod-*"
          - Sid: Functions
            Effect: Allow
            Action: "lambda:*"
            Resource: !Sub "arn:aws:lambda:*:${AWS::AccountId}:function:${Prefix}-prod-*"
          - Sid: FunctionRoles
            Effect: Allow
            Action:
              - "iam:CreateRole"
              - "iam:DeleteRole"
              - "iam:GetRole"
              - "iam:PutRolePolicy"
              - "iam:DeleteRolePolicy"
              - "iam:GetRolePolicy"
              - "iam:ListRolePolicies"
              - "iam:ListAttachedRolePolicies"
              - "iam:ListInstanceProfilesForRole"
              - "iam:TagRole"
              - "iam:UntagRole"
              - "iam:UpdateAssumeRolePolicy"
            Resource: !Sub "arn:aws:iam::${AWS::AccountId}:role/${Prefix}-prod-*"
          - Sid: PassFunctionRoles
            Effect: Allow
            Action: "iam:PassRole"
            Resource: !Sub "arn:aws:iam::${AWS::AccountId}:role/${Prefix}-prod-*"
            Condition:
              StringEquals:
                "iam:PassedToService": lambda.amazonaws.com
          - Sid: Schedules
            Effect: Allow
            Action: "events:*"
            Resource: !Sub "arn:aws:events:*:${AWS::AccountId}:rule/${Prefix}-prod-*"
          - Sid: LogGroups
            Effect: Allow
            Action: "logs:*"
            Resource: !Sub "arn:aws:logs:*:${AWS::AccountId}:log-group:/aws/lambda/${Prefix}-prod-*"
          - Sid: LogGroupLookup
            Effect: Allow
            Action: ["logs:DescribeLogGroups", "logs:ListTagsForResource"]
            Resource: "*"
          - Sid: Alarms
            Effect: Allow
            Action: ["cloudwatch:PutMetricAlarm", "cloudwatch:DeleteAlarms", "cloudwatch:TagResource", "cloudwatch:UntagResource", "cloudwatch:ListTagsForResource"]
            Resource: !Sub "arn:aws:cloudwatch:*:${AWS::AccountId}:alarm:${Prefix}-prod-*"
          - Sid: AlarmLookup
            Effect: Allow
            Action: "cloudwatch:DescribeAlarms"
            Resource: "*"
          - Sid: VectorStore
            Effect: Allow
            Action: "s3vectors:*"
            Resource:
              - !Sub "arn:aws:s3vectors:*:${AWS::AccountId}:bucket/${Prefix}-prod-*"
              - !Sub "arn:aws:s3vectors:*:${AWS::AccountId}:bucket/${Prefix}-prod-*/index/*"

  ProdDeployRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub "${Prefix}-gha-deploy-prod"
      ManagedPolicyArns:
        - !Ref ProdDeployPolicy
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Federated: !If
                - MakeOidc
                - !Ref GitHubOidcProvider
                - !Sub "arn:aws:iam::${AWS::AccountId}:oidc-provider/token.actions.githubusercontent.com"
            Action: sts:AssumeRoleWithWebIdentity
            Condition:
              StringEquals:
                "token.actions.githubusercontent.com:aud": sts.amazonaws.com
              StringLike:
                "token.actions.githubusercontent.com:sub":
                  - !Sub "repo:${GitHubOrg}/${GitHubRepo}:environment:prod"
                  - !Sub "repo:${GitHubOrg}@*/${GitHubRepo}@*:environment:prod"

Outputs:
  StateBucket:
    Value: !Ref StateBucket
    Description: Set as GitHub variable TF_STATE_BUCKET
  PlanRoleArn:
    Value: !GetAtt PlanRole.Arn
    Description: Set as GitHub repository variable AWS_PLAN_ROLE_ARN
  DevDeployRoleArn:
    Value: !GetAtt DevDeployRole.Arn
    Description: Set as variable AWS_ROLE_ARN in the GitHub environment dev
  ProdDeployRoleArn:
    Value: !GetAtt ProdDeployRole.Arn
    Description: Set as variable AWS_ROLE_ARN in the GitHub environment prod
