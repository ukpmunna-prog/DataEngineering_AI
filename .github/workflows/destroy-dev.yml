name: destroy-dev

# Tears down the dev environment. Manual only, and you must type the word destroy.
on:
  workflow_dispatch:
    inputs:
      confirm:
        description: Type "destroy" to confirm
        required: true

permissions:
  id-token: write
  contents: read

jobs:
  destroy:
    if: inputs.confirm == 'destroy'
    runs-on: ubuntu-latest
    environment: dev
    concurrency:
      group: deploy-dev
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.10.5
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
      - run: bash scripts/package.sh
      - name: Terraform destroy
        working-directory: infra/envs/dev
        run: |
          terraform init -input=false \
            -backend-config="bucket=${{ vars.TF_STATE_BUCKET }}" \
            -backend-config="key=sn-change-intel/dev.tfstate" \
            -backend-config="region=${{ vars.AWS_REGION }}"
          terraform destroy -input=false -auto-approve -var-file=dev.tfvars -var="region=${{ vars.AWS_REGION }}"
