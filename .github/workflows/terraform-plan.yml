name: terraform-plan

# Shows reviewers exactly what a pull request would change in AWS. Read-only: nothing is applied here.
on:
  pull_request:
    paths:
      - "infra/envs/**"
      - "infra/modules/**"
      - "src/**"
      - "config/**"
      - "requirements.txt"
      - "scripts/package.sh"

concurrency:
  group: plan-${{ github.ref }}
  cancel-in-progress: true

permissions:
  id-token: write
  contents: read
  pull-requests: write

jobs:
  plan:
    # Fork pull requests get no AWS credentials.
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        env: [dev]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.10.5
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_PLAN_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
      - name: Build Lambda package
        run: ./scripts/package.sh
      - name: Terraform plan
        id: plan
        working-directory: infra/envs/${{ matrix.env }}
        run: |
          terraform init -input=false \
            -backend-config="bucket=${{ vars.TF_STATE_BUCKET }}" \
            -backend-config="key=sn-change-intel/${{ matrix.env }}.tfstate" \
            -backend-config="region=${{ vars.AWS_REGION }}"
          terraform plan -input=false -lock=false -no-color \
            -var-file=${{ matrix.env }}.tfvars -var="region=${{ vars.AWS_REGION }}" \
            -out=tfplan
          terraform show -no-color tfplan > plan.txt
      - name: Comment plan on the pull request
        if: always() && steps.plan.outcome != 'skipped'
        uses: actions/github-script@v7
        env:
          ENV_NAME: ${{ matrix.env }}
        with:
          script: |
            const fs = require('fs');
            const path = `infra/envs/${process.env.ENV_NAME}/plan.txt`;
            let body = fs.existsSync(path) ? fs.readFileSync(path, 'utf8') : 'No plan output (see the job log).';
            if (body.length > 60000) body = body.slice(0, 60000) + '\n... truncated, see the job log';
            const marker = `<!-- tf-plan-${process.env.ENV_NAME} -->`;
            const text = `${marker}\n### Terraform plan: ${process.env.ENV_NAME}\n<details><summary>Show plan</summary>\n\n\`\`\`\n${body}\n\`\`\`\n</details>`;
            const { data: comments } = await github.rest.issues.listComments({ ...context.repo, issue_number: context.issue.number });
            const existing = comments.find(c => c.body && c.body.startsWith(marker));
            if (existing) {
              await github.rest.issues.updateComment({ ...context.repo, comment_id: existing.id, body: text });
            } else {
              await github.rest.issues.createComment({ ...context.repo, issue_number: context.issue.number, body: text });
            }
