name: _deploy (reusable)

on:
  workflow_call:
    inputs:
      environment:
        required: true
        type: string

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    concurrency:
      group: deploy-${{ inputs.environment }}
      cancel-in-progress: false
    env:
      TF_IN_AUTOMATION: "true"
      AWS_REGION: ${{ vars.AWS_REGION }}
      TF_DIR: infra/envs/${{ inputs.environment }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.10.5
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
      - name: Install a current AWS CLI (needed for the s3vectors commands)
        run: |
          curl -sSL "https://awscli.amazonaws.com/awscli-exe-linux-x86_64.zip" -o awscliv2.zip
          unzip -q awscliv2.zip
          sudo ./aws/install --update
          aws --version
      - name: Build Lambda package
        run: ./scripts/package.sh
      - name: Terraform init
        working-directory: ${{ env.TF_DIR }}
        run: |
          terraform init -input=false \
            -backend-config="bucket=${{ vars.TF_STATE_BUCKET }}" \
            -backend-config="key=sn-change-intel/${{ inputs.environment }}.tfstate" \
            -backend-config="region=${{ vars.AWS_REGION }}"
      - name: Terraform plan
        working-directory: ${{ env.TF_DIR }}
        run: |
          terraform plan -input=false -no-color \
            -var-file=${{ inputs.environment }}.tfvars -var="region=${{ vars.AWS_REGION }}" \
            -out=tfplan
      - name: Terraform apply (the plan above, unchanged)
        working-directory: ${{ env.TF_DIR }}
        run: terraform apply -input=false tfplan
      - name: Read outputs
        id: out
        working-directory: ${{ env.TF_DIR }}
        run: |
          echo "secret=$(terraform output -raw servicenow_secret_name)" >> "$GITHUB_OUTPUT"
          echo "vbucket=$(terraform output -raw vector_bucket)" >> "$GITHUB_OUTPUT"
          echo "vindex=$(terraform output -raw vector_index)" >> "$GITHUB_OUTPUT"
      - name: Ensure vector bucket and index exist
        run: ./scripts/ensure_vector_index.sh "${{ steps.out.outputs.vbucket }}" "${{ steps.out.outputs.vindex }}"
      - name: Store ServiceNow credentials
        env:
          SN_USERNAME: ${{ secrets.SN_USERNAME }}
          SN_PASSWORD: ${{ secrets.SN_PASSWORD }}
        run: ./scripts/set_sn_secret.sh "${{ steps.out.outputs.secret }}"
      - name: Smoke test
        run: ./scripts/smoke_test.sh "${{ inputs.environment }}" "${{ steps.out.outputs.vbucket }}" "${{ steps.out.outputs.vindex }}"
