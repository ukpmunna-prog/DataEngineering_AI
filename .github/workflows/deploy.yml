name: deploy

# Merge to main: test, deploy to dev, then wait for approval and deploy to prod.
# Approval is a GitHub Environment "required reviewers" rule on the prod environment.
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      target:
        description: Which environments to deploy
        type: choice
        options: [dev, dev-and-prod]
        default: dev

permissions:
  id-token: write
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements*.txt
      - run: pip install -r requirements-dev.txt
      - run: ruff check .
      - run: pytest -q

  dev:
    needs: test
    uses: ./.github/workflows/_deploy.yml
    with:
      environment: dev
    secrets: inherit

